[project]
name = "vco-api-sim"
version = "0.1.0"
description = "FastAPI-based simulator for the VeloCloud Orchestrator API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.30.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

